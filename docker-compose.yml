name: supplychainiq

services:
  db:
    image: postgres:16-alpine
    container_name: sciq-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplychainiq}
      POSTGRES_USER: ${POSTGRES_USER:-sciq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
