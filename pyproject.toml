[project]
name = "supplychainiq"
version = "0.1.0"
description = "Autonomous market intelligence, demand forecasting and supply chain decision platform (portfolio project)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lohith Kovuri" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4",
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplychainiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d db)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["supplychainiq"]
